# DXVK configuration for Driver: San Francisco
# Enables asynchronous shader compilation, pipeline disk cache, and optimal frame pacing
dxvk.enableAsync = True
dxvk.gplAsyncCache = True
dxvk.enableShaderDiskCache = True

# Optimal D3D9 frame presentation and latency settings
d3d9.maxFrameLatency = 1
d3d9.presentInterval = 1
d3d9.numBackBuffers = 3
d3d9.deferSurfaceCreation = True
d3d9.maxAvailableMemory = 2048
d3d9.allowDiscard = True
d3d9.samplerAnisotropy = 16
